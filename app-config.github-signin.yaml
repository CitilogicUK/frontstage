app:
  signInProvider: github
auth:
  environment: pilot
  providers:
    guest: null
    github:
      pilot:
        clientId: ${FRONTSTAGE_GITHUB_CLIENT_ID}
        clientSecret: ${FRONTSTAGE_GITHUB_CLIENT_SECRET}
        signIn:
          resolvers:
            - resolver: userIdMatchingUserEntityAnnotation
catalog:
  readonly: true
