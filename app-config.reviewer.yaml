auth:
  providers:
    guest:
      userEntityRef: user:default/reviewer
governance:
  requireHumanApprovalEvidence: true
  graduationGroups: [group:default/engineering]
  approvedHostedWorkspaces:
    - provider: Example AI
      workspace: Company sandbox
      allowedSharing: [private, named people]
      allowedDataAccess: ['none']
  approvedCodingTools:
    - id: synthetic-coding-sandbox
      name: Example coding sandbox
      description: Use this fictional entry to demonstrate coding tool policy.
      maxClassification: internal
      docsUrl: https://example.com/frontstage-demo/coding-tools
  approvedConnectors:
    - id: catalog-sandbox
      name: Catalog sandbox
      kind: mcp
      description: Read sandbox ownership and component metadata.
      access: read
      maxClassification: internal
    - id: inventory-sandbox
      name: Inventory sandbox
      kind: data
      description: Submit synthetic inventory adjustments in the sandbox.
      access: write
      maxClassification: public
