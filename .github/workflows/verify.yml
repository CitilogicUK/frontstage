name: Verify Frontstage

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    # Route the prototype PR to the repository runner while hosted minutes are unavailable.
    runs-on: ${{ github.event_name == 'pull_request' && github.head_ref == 'frontstage-prototype-baseline' && github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","frontstage-local"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: corepack enable
      - run: yarn install --immutable
      - name: Validate local reviewer configuration
        run: >-
          yarn backstage-cli config:check
          --config app-config.yaml
          --config app-config.development.yaml
          --config app-config.reviewer.yaml
      - run: yarn tsc --noEmit
      - run: yarn lint:all
      - run: yarn test --watch=false --runInBand
      - run: yarn build:all
      - run: yarn playwright install --with-deps chromium
      - run: yarn test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
