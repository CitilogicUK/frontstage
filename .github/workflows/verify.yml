name: Verify Frontstage

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      use_local_runner:
        description: Use the repository's frontstage-local runner (start it before dispatch)
        type: boolean
        default: true
      verification_ref:
        description: Local runner only. Trusted branch or commit to verify (defaults to the dispatch commit)
        type: string
        required: false
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.FRONTSTAGE_AUTOMATIC_VERIFICATION == 'enabled' &&
       (github.event_name != 'pull_request' || !github.event.pull_request.draft))
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.use_local_runner && fromJSON('["self-hosted","frontstage-local"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.use_local_runner && inputs.verification_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn verify:code
      - run: yarn build:all
      - run: yarn playwright install --with-deps chromium
      - run: yarn test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
